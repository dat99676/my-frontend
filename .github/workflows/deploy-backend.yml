name: CI/CD - Backend Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_BACKEND_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shop-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/shop-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tuỳ chọn: báo cho Render kéo image mới (chỉ chạy khi đã tạo secret RENDER_BACKEND_HOOK_URL)
      - name: Trigger Render deploy
        if: ${{ env.RENDER_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_HOOK"
